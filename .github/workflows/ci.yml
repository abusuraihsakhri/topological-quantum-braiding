name: Python and browser checks

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[server,test]'
          python -m pip check
      - name: Verify Python syntax and run regression suite
        run: |
          python -m compileall -q agents majorana_braiding cli.py simulator.py enrichment.py
          python -m pytest -q
      - name: CLI smoke test
        run: |
          python -m majorana_braiding.cli braid 12 23 12
          topological-quantum-braiding --help
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check web/braiding.mjs
      - run: node --test web/braiding.test.mjs
      - run: python3 -m http.server --help >/dev/null
